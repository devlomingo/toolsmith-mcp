name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build, tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: CLI smoke test
        run: |
          node dist/cli/index.js --version
          cd "$(mktemp -d)"
          node "$GITHUB_WORKSPACE/dist/cli/index.js" init
          test -f toolsmith.config.json && test -f .env
          node "$GITHUB_WORKSPACE/dist/cli/index.js" doctor || true

  postgres:
    name: Full test suite on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: toolsmith
          POSTGRES_DB: toolsmith
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 20
    env:
      TOOLSMITH_TEST_DATABASE_URL: postgres://postgres:toolsmith@localhost:5432/toolsmith
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Security test suite
        run: npm run build && npm run test:security

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t toolsmith-mcp:ci .
      - name: Container starts and reports its version
        run: docker run --rm toolsmith-mcp:ci --version

  benchmark:
    name: Benchmark regression (quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node benchmarks/scripts/performance.mjs --quick
      - run: node benchmarks/scripts/patterns.mjs --quick
      - run: npm run benchmark:check
