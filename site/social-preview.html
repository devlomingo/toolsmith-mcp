<!doctype html>
<!-- Source of docs/images/social-preview.png (1280×640). Re-render with:

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>toolsmith-mcp social preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07080b;
        --ink: #f5f7fb;
        --ink2: #a9b0bd;
        --mute: #6f7684;
        --line: rgba(255, 255, 255, 0.1);
        --blue: #4c8dff;
        --orange: #ff7a2f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Geist', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(520px 420px at 88% 18%, rgba(255, 122, 47, 0.22), transparent 70%),
          radial-gradient(560px 460px at 8% 100%, rgba(76, 141, 255, 0.2), transparent 70%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.35;
        mask-image: radial-gradient(ellipse at 60% 50%, #000 30%, transparent 80%);
      }
      .wrap {
        position: relative;
        display: grid;
        grid-template-columns: 600px 1fr;
        gap: 24px;
        align-items: center;
        height: 100%;
        padding: 0 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font:
          600 26px 'Geist Mono',
          monospace;
        color: var(--ink);
        margin-bottom: 34px;
      }
      .brand img {
        width: 52px;
        height: 52px;
      }
      h1 {
        margin: 0 0 22px;
        font-size: 76px;
        line-height: 1.02;
        font-weight: 750;
        letter-spacing: -0.035em;
      }
      .grad {
        background: linear-gradient(92deg, #ffd2a8 0%, var(--orange) 45%, #ff5f6d 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 0 34px;
        font-size: 24px;
        line-height: 1.4;
        color: var(--ink2);
      }
      .chips {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .chip {
        font:
          500 17px 'Geist Mono',
          monospace;
        padding: 9px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
      }
      .chip b {
        color: var(--orange);
        font-weight: 600;
      }
      svg text {
        font-family: 'Geist Mono', monospace;
      }
    </style>
  </head>
