<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">High traffic: p95 workflow latency</title><desc id="d">Per-run latency at the MCP client while all agents run at once</desc>
<style>
